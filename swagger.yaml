                as_name: "Cloudflare, Inc."
                data:
                  as_name: "Cloudflare, Inc."
                  as_type: "Content"
                  country: "US"
                  registry: "arin"
                  prefix_count: 1542
                  prefix_count_v4: 1180
                  prefix_count_v6: 362
                  announced_ips_v4: 1520640
                  peers_count: 9821
                  providers_count: 18
                  customers_count: 420
                  rpki_valid: 1500
                  rpki_coverage_pct: 97.3
                  ixp_count: 285
                  hosted_domains: 8412339
                  pingable_count: 94021
