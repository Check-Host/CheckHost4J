        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /software/{name}/{version}:
    get:
      tags: [Intelligence]
      operationId: intelSoftwareVersion
      summary: Software intelligence (version-pinned)
      description: Same as `/software/{name}`, restricted to a single version.
      parameters:
        - { name: name,    in: path, required: true, schema: { type: string }, example: "nginx" }
        - { name: version, in: path, required: true, schema: { type: string }, example: "1.24.0" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoftwareIntel' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /scan/{target}:
    get:
      tags: [Intelligence]
      operationId: intelScan
      summary: Recent fullscan jobs for a target
      description: Lists the most-recent fullscan jobs submitted for a target (IP, CIDR, domain or ASN), so clients can deep-link to a fresh report via `GET /fullscan/{uuid}/results` instead of triggering a redundant scan.
      parameters:
        - { name: target, in: path, required: true, schema: { type: string }, example: "check-host.cc" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanRecent' }
              example:
                success: true
                target: "check-host.cc"
                recent_scans:
                  - { uuid: "9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0", scope: "deep", status: "complete", subjobs_done: 5, subjobs_total: 5, created_at: "2026-07-14T09:12:44+00:00", completed_at: "2026-07-14T09:14:02+00:00" }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────────  Fullscan  ─────────────────────────────

  /fullscan:
    post:
      tags: [Fullscan]
      operationId: fullscanSubmit
      summary: Submit a fullscan job
      description: |
        Dispatches a deep, multi-stage scan of a target (IP, CIDR, domain or ASN). The manager classifies the target, fans out typed sub-jobs to dedicated workers (resolve / portscan / banner / body-fetch / threat-intel) and aggregates the results. Returns immediately with `status=pending` — poll `GET /fullscan/{uuid}` for progress and `GET /fullscan/{uuid}/results` for data.

        Anonymous CIDR submissions are capped at `/24` (v4) / `/120` (v6); an API key raises that to `/20` / `/112`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullscanSubmitRequest' }
            example: { apikey: null, target: "check-host.cc", scope: "deep" }
      responses:
        '202':
          description: Accepted — job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullscanJob' }
              example:
                success: true
                uuid: "9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0"
                target: "check-host.cc"
                target_type: "domain"
                scope: "deep"
                status: "pending"
                subjobs_total: 0
                subjobs_done: 0
                subjobs_failed: 0
                error: null
                report_url: "https://check-host.cc/fullscan/9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0"
                api_url: "https://check-host.cc/api/fullscan/9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0"
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: Scan queue unreachable — retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Fullscan is not enabled on this deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /fullscan/{uuid}:
    get:
      tags: [Fullscan]
      operationId: fullscanStatus
      summary: Poll fullscan progress
      description: Returns the current job counters. Workers bump `subjobs_done`; the job moves to `status=complete` (all sub-jobs done) or `partial` (some failed). For the findings themselves, use `GET /fullscan/{uuid}/results`.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid }, example: "9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  job:     { $ref: '#/components/schemas/FullscanJob' }
        '400': { $ref: '#/components/responses/BadInput' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /fullscan/{uuid}/results:
    get:
      tags: [Fullscan]
      operationId: fullscanResults
      summary: Fetch aggregated fullscan results
      description: Returns the actual findings a fullscan produced — open ports, banners, DNS records, BGP context and TLS certificates — aggregated from ClickHouse. Partial results are available while `status=running`.
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid }, example: "9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullscanResults' }
              example:
                success: true
                data:
                  uuid: "9f2c8a14-3b6d-4e21-9a55-71b0c2d8e4f0"
                  target: "1.1.1.1"
                  target_type: "ip"
                  scope: "deep"
                  status: "complete"
                  subjobs_total: 5
                  subjobs_done: 5
                  open_ports:
                    - { port: 443, proto: "tcp", service: "https", last_seen: "2026-07-14 09:13:11" }
                  banners:
                    - { port: 443, server_str: "cloudflare", observed_at: "2026-07-14 09:13:11" }
                  bgp: { asn: 13335, as_name: "Cloudflare, Inc.", prefix: "1.1.1.0/24", rpki_status: "valid" }
        '400': { $ref: '#/components/responses/BadInput' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

# ──────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
      description: >
        Pass your API key (UUID) as `Authorization: Bearer <key>`. This is the
        default and works for every endpoint, GET and POST alike, without ever
        putting the key in the URL. `X-API-Key: <key>` is also accepted, and for
        backward compatibility the key may be sent as an `apikey` field in a POST
        body — but never in the query string. All auth is optional: anonymous use
        is allowed under conservative rate limits, and a key simply lifts them.

  headers:
    X-Ratelimit-Limit:
      description: Maximum requests permitted in the current bucket window.
      schema: { type: integer, example: 60 }
    X-Ratelimit-Remaining:
      description: Requests remaining in the current bucket window. Reaches `0` immediately before the next request returns `429`.
      schema: { type: integer, example: 52 }

  responses:
    InvalidApiKey:
      description: The supplied `apikey` is not a valid UUID, is unknown, or is disabled. Anonymous use does not return this — `apikey` may simply be `null`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: "Invalid or inactive API key." }
    BadInput:
      description: Bad request (missing/invalid input).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { status: 400, error: "No target provided", success: false }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { status: 422, error: "The target field is required.", success: false }
    RateLimited:
      description: Rate limit reached. Wait or supply a higher-tier API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: "Rate limit exceeded. Please slow down." }
    ServerError:
      description: Internal error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { status: 500, error: "Internal server error.", success: false }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: "Job not found." }

  schemas:

    # ─── Requests ───────────────────────────────────────────────────────

    TargetRequest:
      type: object
      required: [target]
      properties:
        apikey: { type: string, format: uuid, nullable: true, description: "Your API key (UUID). Leave null for anonymous use." }
        target: { type: string, example: "check-host.cc", description: "Hostname or IP address." }

    DNSTargetRequest:
      type: object
      required: [target]
      properties:
        apikey:      { type: string, format: uuid, nullable: true }
        target:      { type: string, example: "check-host.cc" }
        querymethod: { type: string, default: "A/AAAA", enum: [A/AAAA, A, AAAA, NS, MD, MF, CNAME, SOA, MB, MG, MR, "NULL", WKS, PTR, HINFO, MINFO, MX, TXT, SRV, EDNS, SPF, AXFR, MAILB, MAILA, ANY, CAA, DNSKEY] }
        region:      { type: array, items: { type: string }, example: ["DE"] }

    MonitoringRequest:
      type: object
      required: [target]
      properties:
        apikey:       { type: string, format: uuid, nullable: true }
        target:       { type: string, example: "check-host.cc" }
        repeatchecks: { type: integer, minimum: 0, maximum: 120, default: 0, description: "0 = single shot. ≥10 enables Live Mode (continuous probing for ~repeatchecks seconds)." }
        timeout:      { type: integer, minimum: 100, maximum: 30000, description: "Per-check timeout in milliseconds. Optional — omit to use the per-method default: ping 1000, tcp 1000, udp 2000, dns 5000, http 15000 (1000 in Live Mode). Values outside 100–30000 are rejected with 422. Note: ICMP ping applies the value at whole-second granularity, so anything below 1000 behaves as 1000." }
        region:
          type: array
          items: { type: string, example: "DE" }
          example: ["DE"]
          description: |
            Mix of:

            - Specific node names from `/locations` — e.g. `DE-NBG-Hetzner`
            - ISO country codes — e.g. `DE`, `US`, `BR`
            - Continent codes — `EU`, `NA`, `AS`, `SA`, `AF`, `OC`

            Continent codes cannot be mixed with specific node names in the same request.

            **If `region` is omitted entirely, the check fans out to every active node worldwide.** That is normally what you want for an availability check; specify a `region` to keep latency low or to test from a particular vantage point.

    MTRMonitoringRequest:
      type: object
      required: [target]
      properties:
        apikey:         { type: string, format: uuid, nullable: true }
        target:         { type: string, example: "check-host.cc" }
        repeatchecks:   { type: integer, minimum: 3, maximum: 30, default: 5, description: "Packets per hop." }
        forceIPversion: { type: integer, enum: [4, 6], nullable: true, description: "Force IPv4 or IPv6. Not all nodes support IPv6." }
        forceProtocol:  { type: string, enum: [udp, tcp], nullable: true, description: "Force UDP or TCP. Default is ICMP. Useful when ICMP is filtered." }
        timeout:        { type: integer, minimum: 100, maximum: 30000, default: 1000, description: "Runtime budget for the trace, in milliseconds for consistency with the other checks. Nodes apply it in whole seconds, so values below 1000 behave as 1000." }
        region:         { type: array, items: { type: string }, example: ["DE"] }

    # ─── Responses ──────────────────────────────────────────────────────

    MyIpResponse:
      type: object
      properties:
        status:  { type: integer, example: 200 }
        message: { type: string, example: "Your current IP is: 34.36.183.77" }
        ip:      { type: string, example: "34.36.183.77" }
        success: { type: boolean, example: true }

    InfoResponse:
      type: object
      description: Geolocation, ASN, privacy and abuse data for a host or IP.
      properties:
        ip:             { type: string, example: "34.36.183.77" }
        reverse:        { type: string, nullable: true, example: "77.183.36.34.bc.googleusercontent.com" }
        country:        { type: string, example: "United States" }
        countryCode:    { type: string, example: "US" }
        isEu:           { type: boolean, example: false }
        city:           { type: string, example: "Kansas City" }
        continent:      { type: string, example: "North America" }
        latitude:       { type: number, example: 39.09973 }
        longitude:      { type: number, example: -94.57857 }
        timeZone:       { type: string, example: "America/Chicago" }
        postalCode:     { type: string, nullable: true, example: "64101" }
        subdivision:    { type: string, nullable: true, example: "Missouri" }
        currencyCode:   { type: string, nullable: true, example: "USD" }
        callingCode:    { type: string, nullable: true, example: "1" }
        privacy:
          type: object
          properties:
            isAbuser:      { type: boolean }
            isAnonymous:   { type: boolean }
            isBogon:       { type: boolean }
            isHosting:     { type: boolean }
            isIcloudRelay: { type: boolean }
            isProxy:       { type: boolean }
            isTor:         { type: boolean }
            isVpn:         { type: boolean }
        asn:
          type: object
          nullable: true
          properties:
            asn:         { type: string, example: "AS396982" }
            route:       { type: string, example: "34.32.0.0/11" }
            netname:     { type: string, example: "GOOGLE-CLOUD-PLATFORM" }
            name:        { type: string, example: "Google LLC" }
            countryCode: { type: string, example: "US" }
            domain:      { type: string, example: "google.com" }
            type:        { type: string, example: "hosting" }
            rir:         { type: string, example: "ARIN" }
        company:
          type: object
          nullable: true
          properties:
            name:        { type: string }
            domain:      { type: string }
            countryCode: { type: string }
            type:        { type: string }
        abuse:
          type: object
          nullable: true
          properties:
            address:     { type: string }
            countryCode: { type: string }
            email:       { type: string, format: email }
            name:        { type: string }
            network:     { type: string }
            phone:       { type: string }
        success: { type: boolean, example: true }

    LocationsResponse:
      type: object
      properties:
        status:        { type: integer, example: 200 }
        CountryCodes:  { type: string, description: "Hint string — country codes are derived from `locationlist[].countryCode`." }
        Continents:    { type: array, items: { type: string }, example: ["EU"] }
        locationlist:
          type: array
          items: { $ref: '#/components/schemas/LocationItem' }

    LocationItem:
      type: object
      properties:
        continent:          { type: string, example: "EU" }
        country:            { type: string, example: "Germany" }
        countryCode:        { type: string, example: "DE" }
        city:               { type: string, example: "Nuernberg" }
        asn:                { type: string, example: "AS24940" }
        isp:                { type: string, example: "Hetzner Online GmbH" }
        datacenter:         { type: string, example: "Hetzner" }
        monitoring_allowed: { type: integer, example: 1 }
        hostname:           { type: string, nullable: true, example: "de-nbg-het.check-host.eu" }
        locationname:       { type: string, example: "DE-NBG-Hetzner", description: "Use this in `region` to target this exact node." }
        sponsor:            { type: string, nullable: true }
        sponsor_url:        { type: string, nullable: true, format: uri }
        latitude:           { type: number, nullable: true }
        longitude:          { type: number, nullable: true }

    CheckCreated:
      type: object
      properties:
        status:       { type: integer, example: 200 }
        success:      { type: boolean, example: true }
        target:       { type: string, example: "check-host.cc" }
        method:       { type: string, example: "ping" }
        repeatchecks: { type: integer, example: 0 }
        region:       { type: array, items: { type: string }, example: ["DE"] }
        uuid:         { type: string, format: uuid }
        reportURL:    { type: string, format: uri, example: "https://check-host.cc/report/0710831d-1589-47d4-9fc1-885fe33a25e4" }
        apiURL:       { type: string, format: uri, example: "https://api.check-host.cc/report/0710831d-1589-47d4-9fc1-885fe33a25e4" }
        og-imageURL:  { type: string, format: uri }
        autodelete:   { type: string, example: "12-05-2036", description: "DD-MM-YYYY. Reports are kept ~10 years." }
        message:      { type: string, example: "Broadcasted task to all slaves." }
        port:         { type: integer, nullable: true }
        query:        { type: string, nullable: true, description: "DNS record type when method is `dns`." }
        payload:      { type: string, nullable: true, description: "UDP payload echoed back (hex string)." }

    CheckReport:
      type: object
      properties:
        status:       { type: integer, example: 200 }
        success:      { type: boolean, example: true }
        target:       { type: string }
        method:       { type: string, enum: [ping, tcp, udp, http, dns, mtr] }
        query:        { type: string, nullable: true }
        repeatchecks: { type: integer }
        created_at:   { type: string, format: date-time }
        delete_at:    { type: string }
        payload:      { type: string, nullable: true }
        data:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ReportLocation' }
          description: "Map keyed by `locationname`. Empty until at least one node has reported."

    ReportLocation:
      type: object
      properties:
        id:                 { type: integer }
        continent:          { type: string }
        country:            { type: string }
        countryCode:        { type: string }
        city:               { type: string }
        isp:                { type: string }
        asn:                { type: string }
        datacenter:         { type: string }
        monitoring_allowed: { type: integer }
        rabbitmq_queue:     { type: string }
        locationname:       { type: string }
        hostname:           { type: string, nullable: true }
        sponsor:            { type: string, nullable: true }
        sponsor_url:        { type: string, nullable: true }
        latitude:           { type: number, nullable: true }
        longitude:          { type: number, nullable: true }
        checks:
          oneOf:
            - { type: array, items: { $ref: '#/components/schemas/PingCheck' }, description: "ping/tcp/udp" }
            - { $ref: '#/components/schemas/HttpCheck' }
            - { $ref: '#/components/schemas/DnsCheck' }
            - { $ref: '#/components/schemas/MtrCheck' }

    PingCheck:
      type: object
      description: Single probe result for ping, tcp, or udp.
      properties:
        location_id:    { type: integer }
        slave_id:       { type: integer }
        repeat:         { type: integer }
        connectiontime: { type: number, description: "Milliseconds. 0 = sub-millisecond." }
        target_ip:      { type: string }
        errortext:      { type: string }
        status:         { type: integer, enum: [0, 1], description: "1 = success, 0 = fail." }

    HttpCheck:
      type: array
      items:
        type: object
        properties:
          location_id:     { type: integer }
          slave_id:        { type: integer }
          repeat:          { type: integer }
          connectiontime:  { type: number }
          http_status:     { type: integer, example: 200 }
          http_statustext: { type: string,  example: "OK" }
          target_ip:       { type: string }
          status:          { type: integer, enum: [0, 1] }

    DnsCheck:
      type: object
      description: DNS lookup result (single object, not an array).
      properties:
        location_id: { type: integer }
        slave_id:    { type: integer }
        data:
          type: array
          items:
            type: object
            properties:
              ttl:      { type: integer, example: 300 }
              address:  { type: string,  example: "34.36.183.77", description: "For A/AAAA records." }
              data:     { type: string,  description: "For TXT/MX/CNAME records." }
              exchange: { type: string,  description: "For MX records." }
              ns:       { type: string,  description: "For NS records." }
        errortext: { type: string }
        status:    { type: integer, enum: [0, 1] }

    MtrCheck:
      type: object
      description: MTR result (single object). `data.hubs` is the per-hop list.
      properties:
        location_id: { type: integer }
        slave_id:    { type: integer }
        data:
          type: object
          properties:
            mtr:
              type: object
              properties:
                src:        { type: string }
                dst:        { type: string }
                tos:        { type: integer }
                tests:      { type: integer }
                psize:      { type: string }
                bitpattern: { type: string }
            hubs:
              type: array
              items:
                type: object
                properties:
                  count:   { type: integer, description: "Hop number (1-indexed)." }
                  host:    { type: string,  description: "Hop IP, or `-` for an unresponsive hop." }
                  Loss%:   { type: number }
                  Snt:     { type: integer }
                  Last:    { type: number }
                  Avg:     { type: number }
                  Best:    { type: number }
                  Wrst:    { type: number }
                  StDev:   { type: number }
                  ASN:     { type: string }
                  PTR:     { type: string }
        errortext: { type: string }
        status:    { type: integer, enum: [0, 1] }

    ErrorResponse:
      type: object
      properties:
        status:  { type: integer, example: 400 }
        success: { type: boolean, example: false }
        error:   { type: string,  example: "No target provided" }

    # ─── Intelligence / Fullscan ────────────────────────────────────────

    IntelData:
      type: object
      additionalProperties: true
      description: "Section map. Arrays are empty and scalars `null` where we hold no data yet — see each endpoint's example for the populated shape."

    IpIntel:
      type: object
      properties:
        success: { type: boolean, example: true }
        ip:      { type: string, example: "1.1.1.1" }
        family:  { type: string, enum: [IPv4, IPv6] }
        data:
          allOf: [ { $ref: '#/components/schemas/IntelData' } ]
          description: >-
            Sections: `ptr`, `open_ports`, `banners`, `tls_certs`,
            `co_hosted_domains`, `external_refs`, `leak_candidates`, `titles`,
            `techs`, `bgp`, `geo`, `probe_findings`, `threat_matches`,
            `threat_count`, `honeypot`, `honeypot_recent` (passwords masked as
            `password_captured` + `password_len`), `honeypot_actor`,
            `honeypot_ja`, `honeypot_classes`.

    AsnIntel:
      type: object
      properties:
        success: { type: boolean, example: true }
        asn:     { type: integer, example: 13335 }
        as_name: { type: string, nullable: true, example: "Cloudflare, Inc." }
        data:    { $ref: '#/components/schemas/IntelData' }

    PrefixIntel:
      type: object
      properties:
        success:       { type: boolean, example: true }
        cidr:          { type: string, example: "1.1.1.0/24" }
        net:           { type: string, example: "1.1.1.0" }
        mask:          { type: integer, example: 24 }
        family:        { type: string, enum: [IPv4, IPv6] }
        anycast_label: { type: string, nullable: true, example: "Anycast (Cloudflare)" }
        data:          { $ref: '#/components/schemas/IntelData' }

    DomainIntel:
      type: object
      properties:
        success: { type: boolean, example: true }
        domain:  { type: string, example: "check-host.cc" }
        data:    { $ref: '#/components/schemas/IntelData' }

    CertIntel:
      type: object
      properties:
        success: { type: boolean, example: true }
        sha256:  { type: string, example: "3a1b8f0c9d2e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f90" }
        data:    { $ref: '#/components/schemas/IntelData' }

    PortIntel:
      type: object
      properties:
        success:    { type: boolean, example: true }
        port:       { type: integer, example: 443 }
        well_known: { type: string, nullable: true, example: "HTTPS" }
        data:       { $ref: '#/components/schemas/IntelData' }

    SoftwareIntel:
      type: object
      properties:
        success: { type: boolean, example: true }
        name:    { type: string, example: "nginx" }
        version: { type: string, nullable: true }
        data:    { $ref: '#/components/schemas/IntelData' }

    ScanRecent:
      type: object
      properties:
        success: { type: boolean, example: true }
        target:  { type: string, example: "check-host.cc" }
        recent_scans:
          type: array
          items: { $ref: '#/components/schemas/FullscanJob' }

    FullscanSubmitRequest:
      type: object
      required: [target]
      properties:
        apikey: { type: string, format: uuid, nullable: true, description: "Optional API key (UUID). Required for custom probe recipes and larger CIDR ranges." }
        target: { type: string, example: "check-host.cc", description: "IPv4/IPv6 address, CIDR block, domain or AS number." }
        scope:  { type: string, enum: [basic, deep, full], default: deep, description: "`basic` = top-100 ports + banner; `deep` = full port range + TLS + body + threat-intel; `full` = deep + subdomain enumeration (domains only)." }

    FullscanJob:
      type: object
      description: Master job row (the shape returned by submit, status, and each entry in `/scan`).
      properties:
        success:        { type: boolean, example: true }
        uuid:           { type: string, format: uuid }
        target:         { type: string, example: "check-host.cc" }
        target_type:    { type: string, enum: [ip, cidr, domain, asn] }
        scope:          { type: string, enum: [basic, deep, full] }
        status:         { type: string, enum: [pending, running, complete, partial, failed] }
        subjobs_total:  { type: integer, example: 5 }
        subjobs_done:   { type: integer, example: 5 }
        subjobs_failed: { type: integer, example: 0 }
        error:          { type: string, nullable: true }
        created_at:     { type: string, format: date-time, nullable: true }
        completed_at:   { type: string, format: date-time, nullable: true }
        report_url:     { type: string, format: uri }
        api_url:        { type: string, format: uri }

    FullscanResults:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          allOf:
            - $ref: '#/components/schemas/FullscanJob'
            - type: object
              properties:
                open_ports:  { type: array, items: { type: object } }
                banners:     { type: array, items: { type: object } }
                dns_records: { type: array, items: { type: object } }
                bgp:         { type: object, nullable: true }
                tls_certs:   { type: array, items: { type: object } }

