                target: "https://check-host.cc"
                method: "http"
                repeatchecks: 0
                region: ["DE"]
                uuid: "2afce05a-a6d8-460c-83fc-0da441c376bc"
                reportURL: "https://check-host.cc/report/2afce05a-a6d8-460c-83fc-0da441c376bc"
