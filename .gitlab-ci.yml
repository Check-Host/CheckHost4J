# GitLab CI for CheckHost4J (Java SDK).
#
# Sync to github.com/Check-Host/CheckHost4J is handled by a GitLab
# native push mirror.

stages:
  - test
  - build
  - publish

default:
  image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

cache:
  key: maven-${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

test:
  stage: test
  script:
    - mvn -B -q test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  script:
    - mvn -B -q package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Optional Sonatype Central deploy. Requires CENTRAL_USERNAME and
# CENTRAL_PASSWORD masked CI/CD variables. Disabled until those are
# configured.
publish_central:
  stage: publish
  script:
    - mvn -B -q deploy -DskipTests -Dcentral.username=$CENTRAL_USERNAME -Dcentral.password=$CENTRAL_PASSWORD
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/ && $CENTRAL_USERNAME && $CENTRAL_PASSWORD
